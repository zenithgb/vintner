plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--username", "VintnerDev"
		}

		gameTest {
			server()
			name = "Vintner Game Tests"
			runDir = "build/gametest-run"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${file("build/test-results/gametest/TEST-vintner.xml")}"
		}

		releaseServer {
			server()
			name = "Vintner Release Server"
			runDir = "build/release-server-run"
			programArg "nogui"
		}
	}

	mods {
		"vintner" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Enables a second GameTest pass against the real optional integration.
	if (providers.gradleProperty("sereneSeasonsTest").isPresent()) {
		// Version IDs avoid ambiguous cross-loader version numbers on Modrinth Maven.
		add("localRuntime", "maven.modrinth:serene-seasons:13sXhUkI")
		add("localRuntime", "maven.modrinth:glitchcore:SDUCBYRU")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

tasks.register("auditReleaseAssets", Exec) {
	group = "verification"
	description = "Audits Vintner JSON, models, textures, recipes, loot, and language coverage."
	workingDir projectDir
	commandLine "python3", "scripts/audit_release_assets.py"
}

tasks.register("prepareReleaseServer") {
	group = "verification"
	description = "Prepares an isolated local server for release smoke testing."

	def smokeDir = layout.buildDirectory.dir("release-server-run")
	outputs.files(
			smokeDir.map { it.file("eula.txt") },
			smokeDir.map { it.file("server.properties") }
	)

	doLast {
		def directory = smokeDir.get().asFile
		directory.mkdirs()

		new File(directory, "eula.txt").text = "eula=true\n"
		new File(directory, "server.properties").text = """
level-name=release-smoke-world
max-players=2
motd=Vintner release smoke test
online-mode=false
server-port=25566
simulation-distance=4
view-distance=4
""".stripIndent().trim() + "\n"
	}
}

tasks.named("runReleaseServer") {
	dependsOn tasks.named("prepareReleaseServer")
}

tasks.named("check") {
	dependsOn tasks.named("auditReleaseAssets")
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE-CODE") {
		rename { "${it}_$projectName" }
	}
	from("LICENSE-GPL-3.0") {
		rename { "${it}_$projectName" }
	}
	from("LICENSING.md") {
		rename { "${it}_$projectName" }
	}
	from("ASSETS_LICENSE.md") {
		rename { "${it}_$projectName" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
